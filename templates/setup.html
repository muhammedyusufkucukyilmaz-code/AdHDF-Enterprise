<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>AdHDF Enterprise — İlk Kurulum</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-2xl">
    <div class="mb-6">
      <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">AdHDF Enterprise v1.2</span>
      <h1 class="text-xl font-bold text-white mt-1">SOC Yönetici Hesabı Oluştur</h1>
      <p class="text-xs text-slate-400 mt-1">Güvenliğiniz için ilk kurulumda kendi SOC panel kullanıcı adı ve parolanızı belirleyin. Tüm ayarlar yerel <code class="text-cyan-300">.env</code> dosyanıza kaydedilir.</p>
    </div>
    <form id="setupForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">SOC Kullanıcı Adı</label>
        <input id="socUser" type="text" value="admin" required class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Güçlü SOC Parolası (En az 8 karakter)</label>
        <input id="socPass" type="password" minlength="8" required placeholder="Örn: SiberSavunma2026!" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white" />
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Çalışma Modu</label>
        <select id="socMode" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
          <option value="static_only">AI-Free Mod (Ekran Kartsız / Anında Tuzak)</option>
          <option value="hybrid_ai">Local LLM Modu (Ollama / LM Studio Bağlantılı)</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2.5 rounded-lg text-sm transition">Kurulumu Tamamla ve Panele Geç</button>
      <p id="errMsg" class="text-xs text-rose-400 text-center"></p>
    </form>
    <p class="text-[11px] text-slate-500 mt-6 text-center">© 2026 Muhammed Yusuf Küçükyılmaz. Tüm hakları saklıdır.</p>
  </div>
  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/setup/init', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('socUser').value.trim(),
          password: document.getElementById('socPass').value,
          mode: document.getElementById('socMode').value
        })
      });
      if (res.ok) {
        window.location.href = '/soc/dashboard';
      } else {
        const d = await res.json();
        document.getElementById('errMsg').textContent = d.detail || 'Kurulum hatası.';
      }
    });
  </script>
</body>
</html>
